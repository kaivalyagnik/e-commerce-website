<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recover your Account</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="card shadow-sm border border-secondary-subtle p-4 w-100 rounded-0" style="max-width: 420px;">
        <h3 class="text-center text-dark mb-4 border-bottom pb-2 fw-bold h4">Recover Account Access</h3>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger rounded-0 border-0 py-2 small" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'seller_forgot' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold text-secondary mb-1">Registered Username</label>
                <input type="text" id="username" name="username" class="form-control rounded-0" placeholder="Enter account username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label small fw-bold text-secondary mb-1">Registered Email ID</label>
                <input type="email" id="email" name="email" class="form-control rounded-0" placeholder="Enter registration email" required>
            </div>
            <button type="submit" class="btn btn-warning w-100 rounded-0 py-2 fw-bold text-uppercase mt-2">Verify & Reset Password</button>
        </form>
        
        <div class="text-center mt-3 small">
            <a href="{% url 'seller_login' %}" class="text-decoration-none text-primary">Cancel and Return to Login</a>
        </div>
    </div>

</body>
</html>
